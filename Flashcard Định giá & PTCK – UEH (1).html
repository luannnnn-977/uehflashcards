2:rgba(214,238,241,.78);--card:rgba(255,255,255,.88);--ok:#1f9d63;--bad:#d6453d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tx:#eaf7f8;--mut:#9cc3ca;--glass:rgba(8,56,66,.55);--line:rgba(255,255,255,.16);--veil1:rgba(3,28,35,.9);--veil2:rgba(5,50,60,.78);--card:rgba(9,52,62,.9)}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--tx);font-family:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;min-height:100vh;background:#073b45;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-3;background:var(--img) center/cover no-repeat;filter:blur(1.5px) saturate(1.15);transform:scale(1.06)}
.veil{position:fixed;inset:0;z-index:-2;background:linear-gradient(160deg,var(--veil1),var(--veil2) 55%,var(--veil1))}
.orbs{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.orbs i{position:absolute;border-radius:50%;filter:blur(40px);opacity:.5;animation:drift 18s ease-in-out infinite}
.orbs i:nth-child(1){width:320px;height:320px;background:#12a4b8;left:-80px;top:8%}
.orbs i:nth-child(2){width:260px;height:260px;background:var(--org);right:-60px;top:35%;animation-duration:22s;animation-delay:-6s;opacity:.35}
.orbs i:nth-child(3){width:300px;height:300px;background:#5fd0dc;left:30%;bottom:-120px;animation-duration:26s;animation-delay:-12s}
.orbs i:nth-child(4){width:120px;height:120px;background:var(--gold);right:20%;top:6%;animation-duration:15s;opacity:.4}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-50px) scale(1.12)}66%{transform:translate(-30px,30px) scale(.94)}}
header{position:relative;margin:14px auto 0;max-width:780px;padding:0 14px}
.hero{position:relative;border-radius:28px;overflow:hidden;padding:46px 20px 52px;text-align:center;color:#fff;background:linear-gradient(180deg,rgba(6,78,90,.35),rgba(6,50,60,.88)),var(--img) center 35%/cover;box-shadow:0 24px 60px rgba(6,60,72,.4);border:1px solid rgba(255,255,255,.25)}
.hero:before{content:"";position:absolute;inset:10px;border:1px solid rgba(255,178,107,.55);border-radius:20px;pointer-events:none}
.logo{display:inline-flex;align-items:baseline;gap:10px}
.logo b{font-family:"Playfair Display",Georgia,serif;font-size:46px;letter-spacing:6px;font-weight:800;text-shadow:0 4px 18px rgba(0,0,0,.35)}
.logo span{font-size:12px;letter-spacing:5px;color:var(--gold);font-weight:700}
.hero h1{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:22px;margin:10px 0 6px;letter-spacing:.5px}
.hero p{margin:0;opacity:.85;font-size:13px;letter-spacing:1px}
.hero .line{width:90px;height:2px;margin:14px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
main{max-width:780px;margin:-22px auto 40px;padding:0 14px;position:relative}
.panel{background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);border-radius:26px;padding:16px;box-shadow:0 20px 50px rgba(6,60,72,.22)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.tab{flex:none;border:1px solid var(--line);border-radius:99px;padding:9px 18px;background:var(--glass);color:var(--tx);font:600 13px inherit;font-family:inherit;cursor:pointer;transition:.25s}
.tab:hover{transform:translateY(-2px)}
.tab.on{background:linear-gradient(135deg,var(--org),#ff9a4d);color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(242,107,33,.4)}
.bar{height:7px;border-radius:9px;background:rgba(10,118,133,.2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--org),var(--gold));transition:width .5s;box-shadow:0 0 12px var(--org)}
.stat{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin:9px 2px 16px;font-weight:600}
.scene{perspective:1400px;height:390px;animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;padding:30px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:auto;box-shadow:0 30px 60px -10px rgba(6,60,72,.55)}
.front{color:#fff;background:linear-gradient(150deg,rgba(10,118,133,.93),rgba(4,46,56,.96)),var(--img) center/cover;border:1px solid rgba(255,255,255,.3)}
.front:before{content:"";position:absolute;inset:12px;border:1px solid rgba(255,178,107,.6);border-radius:18px;pointer-events:none}
.front:after{content:"UEH";position:absolute;right:20px;bottom:6px;font:800 80px "Playfair Display",Georgia,serif;opacity:.07;letter-spacing:4px;pointer-events:none}
.front h2{font-family:"Playfair Display",Georgia,serif;font-size:27px;margin:0;line-height:1.35;font-weight:600;text-shadow:0 3px 14px rgba(0,0,0,.35)}
.back{background:var(--card);color:var(--tx);transform:rotateY(180deg);border:2px solid var(--org);backdrop-filter:blur(10px)}
.tag{position:absolute;top:22px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:10.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;background:linear-gradient(135deg,var(--org),#ff9a4d);color:#fff;padding:5px 14px;border-radius:99px;box-shadow:0 4px 12px rgba(242,107,33,.4)}
.hint{position:absolute;bottom:20px;font-size:12px;opacity:.75;letter-spacing:1px}
.fm{font-family:"Cambria Math","Cambria",Georgia,serif;font-size:20px;line-height:1.75;white-space:pre-wrap;margin:18px 0 0}
.note{margin-top:12px;font-size:13px;color:var(--mut);font-style:italic}
.ctrl{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:20px}
.btn{border:0;border-radius:16px;padding:14px 6px;font:700 14px inherit;font-family:inherit;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--teal),var(--teal-d));box-shadow:0 8px 20px rgba(6,78,90,.3);transition:.2s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.96)}
.btn.g{background:linear-gradient(135deg,#27b878,#177a4d)}
.btn.r{background:linear-gradient(135deg,#ee6a62,#bb3029)}
.sub{display:flex;gap:9px;margin-top:10px;flex-wrap:wrap}
.sub .btn{flex:1;min-width:110px;background:var(--glass);color:var(--tx);border:1px solid var(--line);box-shadow:none;font-weight:600;font-size:13px}
.empty{text-align:center;padding:70px 20px;font-size:19px;font-family:"Playfair Display",Georgia,serif}
.kb{text-align:center;font-size:12px;color:var(--mut);margin-top:16px;line-height:1.6}
@media(max-width:520px){.scene{height:440px}.fm{font-size:17px}.front h2{font-size:22px}.logo b{font-size:38px}.ctrl{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){.scene,.orbs i{animation:none}}
</style>
</head>
<body>
<div class="bg"></div><div class="veil"></div><div class="orbs"><i></i><i></i><i></i><i></i></div>
<header><div class="hero"><div class="logo"><b>UEH</b><span>UNIVERSITY</span></div><h1>Định giá & Phân tích chứng khoán</h1><p>BẢNG TỔNG HỢP CÔNG THỨC · FLASHCARD</p><div class="line"></div></div></header>
<main><div class="panel">
  <div class="tabs" id="tabs"></div>
  <div class="bar"><i id="pb"></i></div>
  <div class="stat"><span id="pos"></span><span id="sc"></span></div>
  <div id="stage"></div>
  <div class="ctrl">
    <button class="btn" id="prev">← Trước</button>
    <button class="btn r" id="no">✗ Chưa nhớ</button>
    <button class="btn g" id="yes">✓ Đã nhớ</button>
    <button class="btn" id="next">Sau →</button>
  </div>
  <div class="sub">
    <button class="btn" id="shuf">🔀 Xáo trộn</button>
    <button class="btn" id="only">🎯 Chỉ ôn thẻ chưa nhớ</button>
    <button class="btn" id="rst">↺ Làm lại</button>
  </div>
  <div class="kb">Phím tắt: Space/Enter = lật · ← → = chuyển thẻ · 1 = chưa nhớ · 2 = đã nhớ</div></div>
</main>
<script>
var D=[
["C2","Mức sinh lời (giá trị tuyệt đối)","Mức sinh lời = Cổ tức + Chênh lệch giá",""],
["C2","Mức sinh lời (%)","R = Cổ tức / Giá ban đầu\n  + (Giá lúc sau − Giá ban đầu) / Giá ban đầu",""],
["C2","Tổng mức sinh lời nhiều kỳ","(1+r₁)(1+r₂)…(1+rₙ)",""],
["C2","Mức sinh lời bình quân hình học (lũy kế)","ⁿ√[(1+r₁)(1+r₂)…(1+rₙ)] − 1",""],
["C2","Mức sinh lời bình quân số học (giản đơn)","(r₁ + r₂ + … + rₙ) / n",""],
["C2","Mức sinh lời bình quân trọng số (IRR)","Đặt IRR = r% → tìm r:\nTiền vốn = TN năm 1/(1+r) + TN năm 2/(1+r)² + … + TN năm n/(1+r)ⁿ",""],
["C2","Mức sinh lời kỳ vọng E(R)","E(R) = Σ TSSL từng giai đoạn × Xác suất từng giai đoạn",""],
["C2","Rủi ro: dữ liệu lịch sử","Phương sai = 1/(n−1) × Σ(TSSL giai đoạn − TSSL bình quân)²\nĐộ lệch chuẩn = √Phương sai",""],
["C2","Rủi ro: dữ liệu dự đoán tương lai","Phương sai = Σ(TSSL giai đoạn − TSSL bình quân)² × Xác suất từng giai đoạn\nĐộ lệch chuẩn = √Phương sai",""],
["C4","Vốn huy động thuần","Tổng tài sản lưu động − Tổng nợ ngắn hạn","Nhóm: khả năng thanh toán"],
["C4","Lưu lượng tiền mặt","Thu nhập ròng (lãi/lỗ) + Khấu hao hàng năm","Nhóm: khả năng thanh toán"],
["C4","Chỉ số Tài sản lưu động","Tổng tài sản lưu động / Tổng nợ ngắn hạn","Nhóm: khả năng thanh toán"],
["C4","Chỉ số Tài sản nhạy cảm","(Tổng tài sản lưu động − Hàng tồn kho) / Tổng nợ ngắn hạn","Nhóm: khả năng thanh toán"],
["C4","Chỉ số Tiền mặt","(Tiền mặt + Chứng khoán khả mại) / Tổng nợ ngắn hạn","Nhóm: khả năng thanh toán"],
["C4","Tổng vốn dài hạn","Tổng vốn cổ đông + Nợ vay dài hạn","Nhóm: phương cách tạo vốn"],
["C4","Tổng vốn cổ đông","Tổng mệnh giá CP thường + Vốn cổ phần (vốn điều lệ)\n+ Thu nhập giữ lại + Thặng dư vốn","Nhóm: phương cách tạo vốn"],
["C4","Nợ vay dài hạn","Tổng mệnh giá trái phiếu + Nợ vay ngân hàng","Nhóm: phương cách tạo vốn"],
["C4","Chỉ số Trái phiếu","Tổng mệnh giá Trái phiếu / Tổng vốn dài hạn","Nhóm: phương cách tạo vốn"],
["C4","Chỉ số Cổ phiếu ưu đãi","Tổng mệnh giá Cổ phiếu ưu đãi / Tổng vốn dài hạn","Nhóm: phương cách tạo vốn"],
["C4","Chỉ số Cổ phiếu thường","Tổng vốn cổ đông / Tổng vốn dài hạn\n= (CPT + VCP + TNGL + Thặng dư) / Tổng vốn dài hạn","Nhóm: phương cách tạo vốn"],
["C4","Chỉ số Nợ trên Vốn cổ phần","(Tổng Trái phiếu + Tổng CPƯĐ) / (Cổ phần thường + TNGL + Thặng dư)","Nhóm: phương cách tạo vốn"],
["C4","Thu nhập hoạt động (EBITDA)","Doanh thu − Chi phí","Nhóm: bảo chứng"],
["C4","Thu nhập trước thuế và lãi vay (EBIT)","Thu nhập hoạt động − Khấu hao","Nhóm: bảo chứng"],
["C4","Thu nhập ròng","EBIT − Lãi vay (lãi trả trên trái phiếu)","Nhóm: bảo chứng"],
["C4","Thu nhập cho cổ đông","Thu nhập ròng − Cổ tức của Cổ phiếu ưu đãi","Nhóm: bảo chứng"],
["C4","Bảo chứng tiền lãi Trái phiếu","EBIT / Tiền lãi trái phiếu hàng năm","Nhóm: bảo chứng"],
["C4","Bảo chứng tiền lãi Cổ phiếu ưu đãi","Thu nhập ròng / Cổ tức Cổ phiếu ưu đãi","Nhóm: bảo chứng"],
["C4","Chỉ số Lợi nhuận hoạt động","EBITDA / Doanh số bán thực\n= (Doanh thu − Chi phí) / Doanh số bán thực","Nhóm: khả năng sinh lời"],
["C4","Chỉ số Lợi nhuận ròng","Thu nhập ròng / Doanh số bán thực\n= (EBIT − Lãi vay) / Doanh số bán thực","Nhóm: khả năng sinh lời"],
["C4","Thu nhập mỗi cổ phần (EPS)","(Thu nhập ròng − Cổ tức ưu đãi) / Số cổ phiếu đang lưu hành","Nhóm: khả năng sinh lời"],
["C4","Cổ phiếu trên mỗi cổ phần (DPS)","(Thu nhập ròng − Cổ tức ưu đãi − TNGL) / Số cổ phiếu đang lưu hành\n= Cổ tức / Số CP lưu hành","Nhóm: khả năng sinh lời"],
["C4","Giá trị sổ sách trên cổ phần (BVPS)","Vốn chủ sở hữu / Số lượng cổ phiếu đang lưu hành","Nhóm: khả năng sinh lời"],
["C4","Chỉ số Thanh toán cổ tức","EPS / DPS","Nhóm: khả năng sinh lời"],
["C4","Tỷ lệ Thu nhập giữ lại","1 − Chỉ số Thanh toán cổ tức","Nhóm: khả năng sinh lời"],
["C4","Cổ tức","Cổ tức = EPS × Tỷ lệ chi trả cổ tức","Nhóm: khả năng sinh lời"],
["C4","Chỉ số Giá trên thu nhập (P/E)","P/E = Thị giá / EPS","Nhóm: triển vọng phát triển"],
["C4","Chỉ số Giá trên giá trị sổ sách (P/B)","P/B = Thị giá / BVPS","Nhóm: triển vọng phát triển"],
["C4","Hệ số đòn bẩy tài chính","Tổng tài sản / Tổng vốn chủ sở hữu\n= 1 / (1 − Tổng nợ / Tổng tài sản)","Nhóm: triển vọng phát triển"],
["C4","ROA – TSSL trên Tổng tài sản","ROA = Lợi nhuận sau thuế / Tổng tài sản bình quân × 100%","Nhóm: triển vọng phát triển"],
["C4","ROS – TSSL trên Doanh thu thuần","ROS = Lợi nhuận sau thuế / Doanh thu thuần × 100%","Nhóm: triển vọng phát triển"],
["C4","ROE – TSSL trên Vốn chủ sở hữu","ROE = Lợi nhuận sau thuế / VCSH bình quân\n= LNST / Tổng tài sản × Đòn bẩy\n= ROS × Vòng quay TS × (1 + Tổng nợ / Tổng VCSH)","Phân tích DuPont"],
["C4","Tốc độ tăng trưởng (g)","g = Tỷ lệ Thu nhập giữ lại × ROE","Nhóm: triển vọng phát triển"],
["C5","Mệnh giá Cổ phiếu","Tổng số vốn huy động (Vốn điều lệ) / Số lượng cổ phiếu đang lưu hành",""],
["C5","Thư giá Cổ phiếu","(Mệnh giá CPT + Vốn thặng dư + TNGL) / Số CP đang lưu hành\n= Tổng vốn cổ phần / Số CP đang lưu hành",""],
["C5","DDM – TH1: không tăng trưởng","P₀ = Cổ tức / TSSL đòi hỏi = D cố định / R%",""],
["C5","DDM – TH2: tăng trưởng đều","P₀ = Cổ tức / (TSSL đòi hỏi − Tốc độ tăng trưởng)\n= D₁ / (r% − g%)",""],
["C5","DDM – TH3: tăng trưởng không đều","P₀ = D₁/(r−g)¹ + D₂/(r−g)² + … + Dₙ/(r−g)ⁿ + Pₙ/(r−g)ⁿ","Pₙ/(r−g)ⁿ áp dụng khi năm n tăng trưởng đều"],
["C5","DDM – Giá Pₙ khi năm n tăng trưởng đều","Pₙ = Dₙ₊₁ / (r% − g%)",""],
["C5","Chỉ số P/E (định giá)","P/E = Thị giá / Thu nhập mỗi cổ phần (EPS)",""],
["C5","Chỉ số P/B (định giá)","P/B = Thị giá / Cổ phiếu trên mỗi cổ phần (DPS)","Theo bảng tổng hợp gốc"],
["C6","Hiện giá TP có kỳ hạn hưởng lãi (đường thẳng)","PV = C × [1 − (1+r)⁻ⁿ] / r + F × (1+r)⁻ⁿ",""],
["C6","Hiện giá TP chiết khấu (không hưởng lãi)","PV = F × (1+r)⁻ⁿ",""],
["C6","Hiện giá TP trả lãi bán niên","PV = (C/2) × [1 − (1 + r/2)⁻²ⁿ] / (r/2) + F × (1 + r/2)⁻²ⁿ",""],
["C6","Hiện giá TP thả nổi","PV = C × [1 − (1+r)⁻ⁿ] / r + F × (1+r)⁻ⁿ = F","Bằng mệnh giá vào kỳ trả lãi"],
["C6","TSSL tức thời (CY)","CY = Cổ tức / Giá vốn của trái phiếu\n= Mệnh giá × Lãi danh nghĩa / Giá vốn",""],
["C6","TSSL đến khi đáo hạn (YTM)","PV = C × [1 − (1+YTM)⁻ⁿ] / YTM + F × (1+YTM)⁻ⁿ → tìm YTM",""],
["C6","TSSL đến khi chuộc lại (YTC)","PV = C × [1 − (1+YTC)⁻ⁿ] / YTC + P_C × (1+YTC)⁻ⁿ → tìm YTC",""],
["C6","Thời gian đáo hạn bình quân (Macaulay Duration)","Dm = [Σ t·C/(1+y)ᵗ + n·F/(1+y)ⁿ] / PV\n= Σ t·CFₜ/(1+y)ᵗ / PV",""],
["C6","Thời gian đáo hạn bình quân điều chỉnh (MD)","MD = Dm / (1 + y)",""],
["C6","Độ lồi (Convexity)","= (d²P/dy²) × 1/PV\n= [Σ t(t+1)C/(1+y)ᵗ⁺² + n(n+1)F/(1+y)ⁿ⁺²] / PV",""],
["C6","Ước tính % thay đổi giá trái phiếu","dP/P = −MD · dy + ½ × (độ lồi) × (dy)²",""]
];
var CH={ALL:"Tất cả",C2:"Chương 2",C4:"Chương 4",C5:"Chương 5",C6:"Chương 6"};
var TT={C2:"CHƯƠNG 2 · Sinh lời & rủi ro",C4:"CHƯƠNG 4 · Phân tích công ty",C5:"CHƯƠNG 5 · Định giá cổ phiếu",C6:"CHƯƠNG 6 · Định giá trái phiếu"};
var cur="ALL",idx=0,order=[],known={},onlyNo=false;
try{known=JSON.parse(localStorage.getItem("ueh_fc")||"{}")}catch(e){}
function save(){try{localStorage.setItem("ueh_fc",JSON.stringify(known))}catch(e){}}
function $(i){return document.getElementById(i)}
function build(keep){
  order=[];
  D.forEach(function(c,i){
    if(cur!=="ALL"&&c[0]!==cur)return;
    if(onlyNo&&known[i]===1)return;
    order.push(i);
  });
  if(!keep)idx=0;
  if(idx>=order.length)idx=0;
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function render(){
  var t=$("tabs");t.innerHTML="";
  Object.keys(CH).forEach(function(k){
    var b=document.createElement("button");b.className="tab"+(k===cur?" on":"");b.textContent=CH[k];
    b.onclick=function(){cur=k;onlyNo=false;$("only").textContent="🎯 Chỉ ôn thẻ chưa nhớ";build();render()};
    t.appendChild(b);
  });
  var tot=0,ok=0;
  D.forEach(function(c,i){if(cur==="ALL"||c[0]===cur){tot++;if(known[i]===1)ok++}});
  $("pb").style.width=(tot?ok/tot*100:0)+"%";
  $("sc").textContent="✓ "+ok+"/"+tot+" thẻ đã nhớ";
  var st=$("stage");
  if(!order.length){
    st.innerHTML='<div class="empty">🎉 Bạn đã nhớ hết thẻ trong phần này!<br><small>Bấm “Làm lại” để ôn lại từ đầu.</small></div>';
    $("pos").textContent="0 / 0";return;
  }
  var c=D[order[idx]];
  $("pos").textContent="Thẻ "+(idx+1)+" / "+order.length;
  st.innerHTML='<div class="scene"><div class="card" id="cd"><div class="face front"><span class="tag">'+TT[c[0]]+'</span><h2>'+esc(c[1])+'</h2><span class="hint">Chạm để xem công thức ⟳</span></div><div class="face back"><span class="tag">'+esc(c[1].length>34?"Công thức":c[1])+'</span><pre class="fm">'+esc(c[2])+'</pre>'+(c[3]?'<div class="note">'+esc(c[3])+'</div>':'')+'</div></div></div>';
  $("cd").onclick=flip;
}
function flip(){var c=$("cd");if(c)c.classList.toggle("flip")}
function go(d){if(!order.length)return;idx=(idx+d+order.length)%order.length;render()}
function mark(v){
  if(!order.length)return;
  known[order[idx]]=v;save();
  if(onlyNo&&v===1){build(true)}else{idx=(idx+1)%Math.max(order.length,1)}
  render();
}
$("prev").onclick=function(){go(-1)};
$("next").onclick=function(){go(1)};
$("yes").onclick=function(){mark(1)};
$("no").onclick=function(){mark(0)};
$("shuf").onclick=function(){
  for(var i=order.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=order[i];order[i]=order[j];order[j]=x}
  idx=0;render();
};
$("only").onclick=function(){
  onlyNo=!onlyNo;this.textContent=onlyNo?"📚 Hiện tất cả thẻ":"🎯 Chỉ ôn thẻ chưa nhớ";build();render();
};
$("rst").onclick=function(){
  D.forEach(function(c,i){if(cur==="ALL"||c[0]===cur)delete known[i]});
  save();onlyNo=false;$("only").textContent="🎯 Chỉ ôn thẻ chưa nhớ";build();render();
};
document.addEventListener("keydown",function(e){
  if(e.key===" "||e.key==="Enter"){e.preventDefault();flip()}
  else if(e.key==="ArrowRight")go(1);
  else if(e.key==="ArrowLeft")go(-1);
  else if(e.key==="1")mark(0);
  else if(e.key==="2")mark(1);
});
build();render();
</script>
</body>
</html>
